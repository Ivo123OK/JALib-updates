name: Powiadomienia z Discorda

# Co ~5 minut czyta kanal odpowiedzi na Discordzie i aktualizuje notifications.json dla moda JALib.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-powiadomienia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz wiadomosci z Discorda
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_NOTIFY_CHANNEL: ${{ secrets.DISCORD_NOTIFY_CHANNEL }}
          DISCORD_ALLOWED_USERS: ${{ secrets.DISCORD_ALLOWED_USERS }}
          DISCORD_AUTHOR_NAME: ${{ secrets.DISCORD_AUTHOR_NAME }}
        run: python3 .github/scripts/discord_sync.py
      - name: Lista uzytkownikow JALib
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USERS_CHANNEL: ${{ secrets.DISCORD_USERS_CHANNEL }}
        run: python3 .github/scripts/discord_users.py
      - name: Zapisz zmiany
        run: |
          if [ -n "$(git status --porcelain notifications.json)" ]; then
            git config user.name "JALib bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notifications.json
            git commit -m "Powiadomienia z Discorda"
            git pull --rebase -q || true
            git push
          fi
